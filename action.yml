name: 'autolabeler-codeowners'
description: 'Automatically label PRs based on CODEOWNERS'
author: 'Pratik Mallya'
inputs:
  githubToken:
    description: 'Github Oauth Token for the repo'
    required: true
  owners-to-labels:
    description: 'Map of CODEOWNERS to label names. Keys are CODEOWNERS and values are labels'
runs:
  using: 'node20'
  main: 'lib/main.js'
